version: 2

updates:
  # npm: version updates are disabled (open-pull-requests-limit: 0).
  # Security updates still arrive; they are enabled in the repository settings
  # under Security > Dependabot security updates.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
